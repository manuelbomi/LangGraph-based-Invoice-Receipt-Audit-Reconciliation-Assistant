# A generic, single database configuration.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = .
path_separator = os

sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/invoice_audit
; Overridden at runtime by the DATABASE_URL env var (see app/db/migrations/env.py)


[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
